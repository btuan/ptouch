[project]
name = "ptlabel"
version = "0.1.0"
description = "Brother PT-P950NW label design + printing: spec -> render -> raster -> TCP 9100"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10",
  "pydantic>=2.6",
  "segno>=1.6",
  "python-barcode>=0.15",
  "ppf-datamatrix>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "anthropic>=2.6.0",
]

[project.scripts]
ptlabel = "ptlabel.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptlabel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
